buildscript {
    if (!gradle.startParameter.projectProperties.containsKey('offlineTarget')) {
        repositories {
            gradlePluginPortal()
            maven { url = 'https://maven.neoforged.net/releases' }
        }
        dependencies {
            classpath "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:${project.moddev_version}"
        }
    }
}

apply plugin: 'java-library'
apply plugin: 'idea'

def buildNumber = providers.gradleProperty('buildNumber').getOrElse(java.time.format.DateTimeFormatter.ofPattern('yyyyMMddHHmmss').format(java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)))
if (!(buildNumber ==~ /[A-Za-z0-9.-]+/)) throw new GradleException('buildNumber may contain only letters, digits, dots and hyphens')
version = "${mod_version}.build.${buildNumber}"
ext.fullVerification = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['build', 'verifyIntegrations', 'verifyRelease'] }
apply from: 'gradle/dependencies.gradle'
group = mod_group_id
base { archivesName = mod_archive_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

apply from: 'gradle/platform.gradle'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-proc:none']
}
tasks.withType(ProcessResources).configureEach { exclude '**/.DS_Store' }
tasks.named('processResources') {
    inputs.property('mod_version', project.version.toString())
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version.toString()) }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar') {
    // Definitions and sounds ship in Core; editable custom textures stay in KubeJS.
    exclude 'assets/**/textures/**'
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': project.version.toString(),
            'Implementation-Vendor': mod_authors)
}

// Each script owns one part of development and verification setup.
apply from: 'gradle/build-info.gradle'
apply from: 'gradle/development.gradle'
apply from: 'gradle/game-tests.gradle'
apply from: 'gradle/verification.gradle'
